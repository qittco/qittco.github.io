<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f7f7f2">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <title>Page not found — Yan Guzman</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <!-- A helpful 404 is better than making people wonder if they broke something. -->
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <main id="main-content" class="container notfound-main">
    <p class="section-kicker">404 / NOTHING HERE</p>
    <h1 class="notfound-title">Well, that went somewhere unexpected<span class="period">.</span></h1>
    <p class="notfound-copy">The page you're looking for doesn't exist, or maybe it moved. No worries—the homepage is right over here.</p>
    <p class="notfound-action"><a class="button button-primary" href="/">Back to the homepage <span aria-hidden="true">↗</span></a></p>
  </main>
</body>
</html>
